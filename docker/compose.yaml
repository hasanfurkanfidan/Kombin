name: kombin

services:
  db:
    # PostgreSQL 18 with pgvector (the wardrobe embeddings). Debian-based: a volume created by the former postgres:18-alpine image works,
    # but its text indexes were built with musl's collation; run `REINDEX DATABASE kombin;` once after switching (see the README).
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kombin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required, copy docker/.env.example to docker/.env}
      POSTGRES_DB: ${POSTGRES_DB:-kombin}
    ports:
      # Loopback only: the database is never reachable from the network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    networks:
      - backend
    volumes:
      # PostgreSQL 18 images keep versioned data directories below /var/lib/postgresql.
      - kombin-pgdata:/var/lib/postgresql
      # Creates the read-only role Metabase connects with. Runs only when the data directory is empty (see the README for existing volumes).
      - ./postgres/metabase_ro.sql:/docker-entrypoint-initdb.d/10-metabase-ro.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=$${POSTGRES_USER} --dbname=$${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # S3-compatible object storage (wardrobe photos). The minio/minio image is no longer published on Docker Hub; Chainguard's MinIO build
  # is used instead ("latest-dev" because it carries the shell, wget and mc that the health check and the bucket setup need; Chainguard
  # publishes only "latest" tags for free). The S3 port is published like the API's, so a phone on the LAN can upload to it; the console
  # stays on loopback.
  minio:
    image: cgr.dev/chainguard/minio:latest-dev
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-kombin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-kombin_dev_minio_password}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    networks:
      - backend
    volumes:
      - kombin-minio-data:/data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # One-shot: creates the "kombin" bucket and makes the processed images (cutout.*, thumb.*) anonymously readable. Originals stay private.
  minio-init:
    image: cgr.dev/chainguard/minio:latest-dev
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - backend
    environment:
      MC_HOST_local: http://${MINIO_ROOT_USER:-kombin}:${MINIO_ROOT_PASSWORD:-kombin_dev_minio_password}@minio:9000
    volumes:
      - ./minio/public-read.json:/policy/public-read.json:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - mc --config-dir /tmp/mc mb --ignore-existing local/kombin && mc --config-dir /tmp/mc anonymous set-json /policy/public-read.json local/kombin

  # Garment analysis (background removal, category, colors, embedding). Built from the sibling kombin-vision checkout; the API reaches it
  # as http://vision:8090. Host port 8092 is for debugging and for an API started with `dotnet run` (stop a standalone kombin-vision
  # stack first, it uses the same port). ~1.7 GB idle, ~2.9 GB peak (kombin-vision/README.md, "Memory").
  vision:
    build:
      context: ../../kombin-vision
    image: kombin-vision:local
    restart: unless-stopped
    environment:
      # The service refuses to start without it (at least 16 characters).
      VISION_INTERNAL_KEY: ${VISION_INTERNAL_KEY:-}
      VISION_TORCH_THREADS: ${VISION_TORCH_THREADS:-4}
      VISION_MAX_CONCURRENCY: ${VISION_MAX_CONCURRENCY:-2}
    ports:
      - "127.0.0.1:${VISION_PORT:-8092}:8090"
    networks:
      - backend
    mem_limit: 4g

  api:
    build:
      context: ..
      dockerfile: src/Kombin.Api/Dockerfile
    restart: unless-stopped
    # Not on vision: the API starts in seconds while vision loads its models for ~40 s, and wardrobe-analyze retries until it answers.
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - backend
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      # Local development stack: Development applies migrations at startup (Database__MigrateOnStartup).
      # Real deployments run Production and migrate with `dotnet ef database update`.
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Postgres: Host=db;Port=5432;Database=${POSTGRES_DB:-kombin};Username=${POSTGRES_USER:-kombin};Password=${POSTGRES_PASSWORD}
      Database__MigrateOnStartup: ${MIGRATE_ON_STARTUP:-true}
      # Fills an empty database with the dev catalog and the demo user; ignored (with a warning) outside Development.
      Database__SeedOnStartup: ${SEED_ON_STARTUP:-true}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY is required, generate one with `openssl rand -base64 48` and put it in docker/.env}
      Jwt__Issuer: ${JWT_ISSUER:-kombin-api}
      Jwt__Audience: ${JWT_AUDIENCE:-kombin-app}
      # Sign in with Google / Apple: the client IDs an ID token's audience must match (blank entries are ignored). A provider without any
      # answers POST /api/v1/auth/external with 503 Identity.ExternalProviderDisabled.
      Authentication__Google__ClientIds__0: ${GOOGLE_CLIENT_ID_ANDROID:-}
      Authentication__Google__ClientIds__1: ${GOOGLE_CLIENT_ID_IOS:-}
      Authentication__Google__ClientIds__2: ${GOOGLE_CLIENT_ID_WEB:-}
      Authentication__Apple__ClientIds__0: ${APPLE_CLIENT_ID_IOS:-}
      Authentication__Apple__ClientIds__1: ${APPLE_SERVICES_ID:-}
      Internal__ApiKey: ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required, generate one with `openssl rand -base64 48` and put it in docker/.env}
      # Salt for the hashed IPs stored with outbound clicks. The default is a Development-only placeholder; any other environment must set its own.
      Outbound__IpSalt: ${OUTBOUND_IP_SALT:-dev-only-ip-salt-change-me-0123456789abcdef}
      # Runs the Hangfire server and the recurring notification jobs in this container; the dashboard (/hangfire) exists in Development only.
      Hangfire__Enabled: ${HANGFIRE_ENABLED:-true}
      # Optional: only needed when "enhanced push security" is enforced for the Expo project.
      Expo__AccessToken: ${EXPO_ACCESS_TOKEN:-}
      # Object storage. The API talks to MinIO inside the network; presigned upload URLs and public image URLs use the address the app
      # reaches (STORAGE_PUBLIC_URL; set it to http://<your LAN IP>:9000 for a phone).
      Storage__Endpoint: http://minio:9000
      Storage__PresignEndpoint: ${STORAGE_PUBLIC_URL:-http://localhost:9000}
      Storage__PublicBaseUrl: ${STORAGE_PUBLIC_URL:-http://localhost:9000}/kombin
      Storage__Bucket: kombin
      Storage__AccessKey: ${MINIO_ROOT_USER:-kombin}
      Storage__SecretKey: ${MINIO_ROOT_PASSWORD:-kombin_dev_minio_password}
      Storage__ForcePathStyle: "true"
      Vision__BaseUrl: http://vision:8090
      Vision__InternalKey: ${VISION_INTERNAL_KEY:-}
      # Outfit engine: Open-Meteo forecasts (free, no key) for the profile's city; narration by templates unless an Anthropic key is set
      # and NARRATION_PROVIDER=Anthropic, in which case template lines are upgraded in the background (outfit-narrate job).
      Weather__Enabled: ${WEATHER_ENABLED:-true}
      Narration__Provider: ${NARRATION_PROVIDER:-Template}
      Anthropic__ApiKey: ${ANTHROPIC_API_KEY:-}

  # For operators only: dashboards over the analytics tables. Not started by a plain `up`, so CI's smoke test and day-to-day development
  # never pull or run it; start it with `docker compose --file docker/compose.yaml --profile metabase up --detach metabase`.
  metabase:
    image: metabase/metabase:latest
    profiles: ["metabase"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    ports:
      # Loopback only: Metabase has its own login but is not meant to be exposed.
      - "127.0.0.1:${METABASE_PORT:-3000}:3000"
    environment:
      # Metabase's own application database (users, questions, dashboards) is an embedded H2 file in the named volume below.
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - kombin-metabase-data:/metabase-data

networks:
  backend:

volumes:
  kombin-pgdata:
  kombin-metabase-data:
  kombin-minio-data:
